  # - prepare
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ''
  IMAGE_TAG: '$CI_REGISTRY_IMAGE:achetut-expo-$CI_COMMIT_SHORT_SHA'
  IMAGE_LATEST: '$CI_REGISTRY_IMAGE:latest'
  BACKEND_URL: 'https://achetut-back.time2map.com'
