stages:
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ''
  IMAGE_TAG: '$CI_REGISTRY_IMAGE:archi2go-web-$CI_COMMIT_SHORT_SHA'
  VITE_MAPBOX_STYLE: 'mapbox://styles/mapbox/standard'

.deploy-web:
  stage: deploy
  tags:
    - achetut-amsterdam
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --build-arg VITE_MAPBOX_ACCESS_TOKEN="$VITE_MAPBOX_ACCESS_TOKEN" --build-arg VITE_MAPBOX_STYLE="$VITE_MAPBOX_STYLE" -t "$IMAGE_TAG" .
    - docker compose down
    - docker compose up -d
    - sleep 10
    - docker compose logs web-app --tail=20
    - docker compose ps

deploy-main:
  extends: .deploy-web
  variables:
    WEB_PORT: 8081
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-dev:
  extends: .deploy-web
  variables:
    WEB_PORT: 8082
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
