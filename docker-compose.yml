# Боевой проект: archi2go.time2map.com. Порт публикуется только на loopback —
# снаружи вход через nginx хоста (vhost + TLS Let's Encrypt).
name: achetut-web

services:
  web-app:
    image: ${IMAGE_TAG:-achetut-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ARCHI2GO_BACK_URL: ${VITE_ARCHI2GO_BACK_URL:-https://archi2api.time2map.com}
        VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:-}
        VITE_MAPBOX_STYLE: ${VITE_MAPBOX_STYLE:-mapbox://styles/mapbox/standard}
    container_name: achetut-web
    ports:
      - '127.0.0.1:${WEB_PORT:-8081}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
