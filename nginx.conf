server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Проверка живости для healthcheck в compose
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Ассеты с хэшем в имени: кэшируются надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе после деплоя браузер тянет старый бандл
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: клиентские маршруты (/design-1/paris) отдают index.html
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
